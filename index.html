<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="only light">
  <title>ジグソーパズル</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="viewport" class="viewport">
    <div id="work-area" class="work-area" hidden>
      <svg id="board" class="board" aria-label="土台"></svg>
      <div id="pieces" class="pieces"></div>
    </div>
    <p id="message" class="message" role="alert" hidden></p>
  </main>

  <aside id="panel" class="panel" aria-label="操作パネル">
    <button id="thumbnail-button" class="thumbnail-button" type="button" aria-label="完成図を拡大表示" hidden>
      <img id="thumbnail" class="thumbnail" alt="完成図">
    </button>
    <div class="puzzle-info">
      <span id="puzzle-name" class="puzzle-name">読み込み中…</span>
      <span class="progress">完成 <span id="placed-count">0</span> / <span id="total-count">0</span></span>
    </div>
    <!-- セーブ／ロード・アシストは、各開発手順でここに追加する -->
    <div id="panel-controls" class="panel-controls">
      <!-- 画像の切り替え（サンプルと、さいごに えらんだ がぞう）。選んだ画像は端末内だけで使い、送信しない -->
      <select id="image-select" class="image-select" aria-label="がぞうを きりかえる"></select>
      <label class="panel-button file-button">
        がぞうを えらぶ
        <input id="image-file" class="visually-hidden" type="file" accept="image/jpeg,image/png,image/webp">
      </label>
      <!-- 効果音のON／OFF（今の状態を表示する）と音量（すべての効果音で共通） -->
      <button id="sound-toggle" class="panel-button" type="button" aria-pressed="true">おと ON</button>
      <label class="volume-control">
        <span class="volume-label">おとの おおきさ</span>
        <input id="sound-volume" class="volume-slider" type="range" min="0" max="100" step="1" value="50">
      </label>
      <!-- 開始直後・プレイ中・完成後のいつでも使える -->
      <button id="restart-button" class="panel-button" type="button">さいしょから</button>
    </div>
  </aside>

  <div id="preview" class="preview" role="dialog" aria-modal="true" aria-label="完成図の拡大表示" tabindex="-1" hidden>
    <img id="preview-image" class="preview-image" alt="完成図（拡大）">
  </div>

  <!-- 完成演出（クリック・タップ・Escキーで閉じる） -->
  <div id="complete" class="complete" role="dialog" aria-modal="true" aria-label="パズル完成" tabindex="-1" hidden>
    <p class="complete-message">できた！！！</p>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
